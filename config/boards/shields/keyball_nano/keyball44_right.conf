CONFIG_SPI=y
CONFIG_INPUT=y
CONFIG_ZMK_MOUSE=y
CONFIG_ZMK_EXT_POWER=y

CONFIG_PMW3610=y
CONFIG_PMW3610_CPI=1200
CONFIG_PMW3610_CPI_DIVIDOR=2
CONFIG_PMW3610_ORIENTATION_180=y
# CONFIG_PMW3610_SNIPE_CPI=400         # disabled: snipe layer removed; re-enable with snipe-layers in overlay
# CONFIG_PMW3610_SNIPE_CPI_DIVIDOR=4   # disabled: snipe layer removed; re-enable with snipe-layers in overlay
CONFIG_PMW3610_SCROLL_TICK=32
CONFIG_PMW3610_INVERT_SCROLL_X=y
CONFIG_PMW3610_INVERT_SCROLL_Y=n
CONFIG_PMW3610_SMART_ALGORITHM=y
CONFIG_PMW3610_RUN_DOWNSHIFT_TIME_MS=3264
CONFIG_PMW3610_REST1_SAMPLE_TIME_MS=20
#CONFIG_PMW3610_REST1_DOWNSHIFT_TIME_MS=9600
#CONFIG_PMW3610_REST2_SAMPLE_TIME_MS=
#CONFIG_PMW3610_REST2_DOWNSHIFT_TIME_MS=
#CONFIG_PMW3610_REST3_SAMPLE_TIME_MS=
#CONFIG_PMW3610_REST3_DOWNSHIFT_TIME_MS=
#CONFIG_PMW3610_FORCE_AWAKE=n
# CONFIG_PMW3610_POLLING_RATE_125_SW=y  # previous: software-driven 125Hz, caused input delay
CONFIG_PMW3610_POLLING_RATE_250=y        # hardware interrupt-driven 250Hz, halves latency

CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n
CONFIG_PMW3610_AUTOMOUSE_TIMEOUT_MS=700
# Filters PMW3610 noise (±1-2 counts at rest) that would otherwise reset the idle timer and
# prevent the display from turning off. 2 is the minimum that clears typical sensor noise;
# increase if the right display still won't idle. Was 0 (report every non-zero delta).
CONFIG_PMW3610_MOVEMENT_THRESHOLD=2
