CONFIG_SPI=y
CONFIG_INPUT=y
CONFIG_ZMK_MOUSE=y
CONFIG_ZMK_EXT_POWER=y

CONFIG_PMW3610=y
CONFIG_PMW3610_CPI=1200
CONFIG_PMW3610_CPI_DIVIDOR=2
CONFIG_PMW3610_ORIENTATION_180=y
# CONFIG_PMW3610_SNIPE_CPI=400         # disabled: snipe layer removed; re-enable with snipe-layers in overlay
# CONFIG_PMW3610_SNIPE_CPI_DIVIDOR=4   # disabled: snipe layer removed; re-enable with snipe-layers in overlay
CONFIG_PMW3610_SCROLL_TICK=32
CONFIG_PMW3610_INVERT_SCROLL_X=y
CONFIG_PMW3610_INVERT_SCROLL_Y=n
CONFIG_PMW3610_SMART_ALGORITHM=y
# Max allowed by driver Kconfig is 3264ms. Set to max to keep sensor in RUN mode as long as
# possible, reducing latency at the cost of higher IRQ rate while idle.
CONFIG_PMW3610_RUN_DOWNSHIFT_TIME_MS=3264
# REST1: 10ms (100Hz) is the minimum allowed (range 10-2550). Closest achievable to RUN's 4ms/250Hz.
# Stays in REST1 for 10s before stepping down.
CONFIG_PMW3610_REST1_SAMPLE_TIME_MS=10
CONFIG_PMW3610_REST1_DOWNSHIFT_TIME_MS=10000
# REST2: drop to 20ms (50Hz) for 10s — same rate REST1 previously used.
CONFIG_PMW3610_REST2_SAMPLE_TIME_MS=20
CONFIG_PMW3610_REST2_DOWNSHIFT_TIME_MS=10000
# REST3: default (deep battery saving rate)
#CONFIG_PMW3610_REST3_SAMPLE_TIME_MS=
#CONFIG_PMW3610_REST3_DOWNSHIFT_TIME_MS=
#CONFIG_PMW3610_FORCE_AWAKE=n
# CONFIG_PMW3610_POLLING_RATE_125_SW=y  # previous: software-driven 125Hz, caused input delay
CONFIG_PMW3610_POLLING_RATE_250=y        # hardware interrupt-driven 250Hz, halves latency

CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n
CONFIG_PMW3610_AUTOMOUSE_TIMEOUT_MS=1000
# Filters PMW3610 noise at rest that would otherwise reset the idle timer and prevent sleep.
# Was 10 (raised for sleep diagnostics); lowered to driver default now that REST downshift
# chain handles idle power reduction. Higher values require more movement to activate mouse layer.
CONFIG_PMW3610_MOVEMENT_THRESHOLD=5
