# Pushes host to negotiate the tightest possible connection interval (7.5ms). Without MIN, the host
# can select a wider interval even when MAX is constrained.
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=6
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=9
# Set to 0 (was 16) to eliminate trackball lag. Peripheral latency allows the BLE device to skip
# up to N connection events, saving power but adding up to N * 11.25ms (≈180ms) worst-case lag
# per mouse report. Zero means respond at every connection event. Battery trade-off: the device
# wakes the radio more frequently; expect moderately higher power draw on the right (trackball) half.
# To rollback: set back to 16.
CONFIG_BT_PERIPHERAL_PREF_LATENCY=0
# Supervision timeout in units of 10ms (200 = 2s, was default ~4s). Faster drop detection means
# quicker reconnect after interference, at the cost of being slightly more aggressive on marginal links.
CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=200
CONFIG_BT_BUF_ACL_TX_COUNT=32
# Matched to TX count. Default RX is ~4-6, which creates backpressure when the host ACKs faster
# than the keyboard can buffer.
CONFIG_BT_BUF_ACL_RX_COUNT=32
CONFIG_BT_L2CAP_TX_BUF_COUNT=32

# IDLE_TIMEOUT = display off; IDLE_SLEEP_TIMEOUT = deep sleep (measured from last activity).
# Gap between display-off and deep sleep: 35000 - 30000 = 5 seconds.
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_TIMEOUT=900000
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=905000

# set transmission power to max
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
CONFIG_ZMK_BEHAVIORS_QUEUE_SIZE=512

CONFIG_ZMK_KEYBOARD_NAME="bw-keyball"
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_EXT_POWER=y
